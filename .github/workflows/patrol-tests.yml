name: Patrol tests (no note actions)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with: {node-version: '24.19.0'}
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
      - name: Test without note credentials or live writes
        run: npm test
