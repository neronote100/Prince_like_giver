name: Probe note follow surface
on:
  push:
    branches: [main]
    paths: ['scripts/follower-surface-smoke.mjs', '.github/workflows/follow-surface.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright-core@1.55.0
      - name: Resolve Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN" || exit 1
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Inspect read-only follow pages
        env:
          NOTE_SESSION_COOKIE: ${{ secrets.NOTE_SESSION_COOKIE }}
        run: node scripts/follower-surface-smoke.mjs
