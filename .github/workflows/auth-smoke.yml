name: Verify note session
on:
  push:
    branches:
      - feature/note-discovery-auth-smoke
      - main
    paths:
      - '.github/workflows/auth-smoke.yml'
      - 'scripts/auth-smoke.mjs'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-note-session
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright-core@1.55.0
      - name: Unit tests
        run: npm test
      - name: Locate Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN" || { echo "Chrome is not installed"; exit 1; }
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Verify Nero note session
        env:
          NOTE_SESSION_COOKIE: ${{ secrets.NOTE_SESSION_COOKIE }}
        run: node scripts/auth-smoke.mjs
