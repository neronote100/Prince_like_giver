name: Collect manual note candidates

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/candidates.yml

permissions:
  contents: write

concurrency:
  group: prince-manual-candidate-bridge
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main' && vars.DISABLE_CANDIDATE_DISCOVERY != 'true'
    uses: neronote100/nero_comment_reader/.github/workflows/like-candidates.yml@c764dc8056ca35b9e49ab44c389095870e6881e1
    with:
      source_ref: c764dc8056ca35b9e49ab44c389095870e6881e1
    secrets:
      NOTE_SESSION_COOKIE: ${{ secrets.NOTE_SESSION_COOKIE }}
