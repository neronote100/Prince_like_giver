name: Candidate list (read-only)
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/candidates.mjs
      - tests/candidates.test.mjs
      - scripts/render-review-board.mjs
      - scripts/verify-mobile-board.mjs
      - tests/review-board.test.mjs
      - .github/workflows/candidates.yml
permissions:
  contents: read
concurrency:
  group: note-candidates
  cancel-in-progress: false
jobs:
  collect:
    if: vars.DISABLE_CANDIDATE_DISCOVERY != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright-core@1.55.0
      - run: node --check scripts/candidates.mjs
      - run: npm test
      - name: Find Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN" || exit 1
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Verify 15 candidate rows on smartphone screens
        run: node scripts/verify-mobile-board.mjs
      - name: Collect public candidates in authenticated context
        env:
          NOTE_SESSION_COOKIE: ${{ secrets.NOTE_SESSION_COOKIE }}
        run: node scripts/candidates.mjs
      - name: Render manual review board
        run: node scripts/render-review-board.mjs
      - name: Upload review files (1 day)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: prince-candidate-review
          path: |
            .tmp/candidates.json
            .tmp/candidate-review.html
            .tmp/mobile-15-preview.png
          if-no-files-found: error
          retention-days: 1
