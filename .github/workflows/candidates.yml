name: Collect manual note candidates

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/candidates.yml

permissions:
  contents: write
  id-token: write

concurrency:
  group: prince-manual-candidate-bridge
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main' && vars.DISABLE_CANDIDATE_DISCOVERY != 'true'
    uses: neronote100/nero_comment_reader/.github/workflows/like-candidates.yml@2f28860e695c69d4cc835dd6d36f89665518259f
    with:
      source_ref: 2f28860e695c69d4cc835dd6d36f89665518259f
    secrets:
      NOTE_SESSION_COOKIE: ${{ secrets.NOTE_SESSION_COOKIE }}
