name: Collect manual note candidates

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/candidates.yml

permissions:
  contents: write
  id-token: write

concurrency:
  group: prince-manual-candidate-bridge
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main' && vars.DISABLE_CANDIDATE_DISCOVERY != 'true'
    uses: neronote100/nero_comment_reader/.github/workflows/like-candidates.yml@030931867e77cf4e0d84b63f5698645541b806a0
    with:
      source_ref: 030931867e77cf4e0d84b63f5698645541b806a0
    secrets:
      NOTE_SESSION_COOKIE: ${{ secrets.NOTE_SESSION_COOKIE }}
