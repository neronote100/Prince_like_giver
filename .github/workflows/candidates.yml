name: Note patrol (one like per run)
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/candidates.mjs
      - scripts/auth-smoke.mjs
      - scripts/auto-like.mjs
      - src/auto-like.mjs
      - src/github-like-state.mjs
      - src/note-action-client.mjs
      - tests/auto-like.test.mjs
      - tests/github-like-state.test.mjs
      - tests/note-action-client.test.mjs
      - tests/candidates.test.mjs
      - scripts/render-review-board.mjs
      - scripts/verify-mobile-board.mjs
      - scripts/prepare-worker-candidates.mjs
      - scripts/verify-worker-dashboard.mjs
      - src/worker.mjs
      - src/dashboard.mjs
      - tests/worker-like.test.mjs
      - wrangler.toml
      - tests/review-board.test.mjs
      - .github/workflows/candidates.yml
permissions:
  contents: read
concurrency:
  group: note-candidates
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main' && vars.DISABLE_CANDIDATE_DISCOVERY != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with: {node-version: '24.19.0'}
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
      - run: node --check scripts/candidates.mjs
      - run: npm test
      - name: Find Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN" || exit 1
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Verify 15 candidate rows on smartphone screens
        run: node scripts/verify-mobile-board.mjs
      - name: Verify real Worker dashboard with mock actions
        run: node scripts/verify-worker-dashboard.mjs
      - name: Collect public candidates in authenticated context
        env:
          NOTE_SESSION_COOKIE: ${{ secrets.NOTE_SESSION_COOKIE }}
        run: node scripts/candidates.mjs
      - name: Render manual review board
        run: node scripts/render-review-board.mjs
      - name: Prepare Worker candidate list
        run: node scripts/prepare-worker-candidates.mjs
      - name: Verify Worker bundle (dry run)
        run: npx --yes wrangler@4 deploy --dry-run
      - name: Check Cloudflare credentials
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ "${#DASHBOARD_TOKEN}" -ge 24 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare Worker deployment disabled: required secrets are missing."
          fi
      - name: Deploy one-click review Worker
        if: steps.cf.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          NOTE_SESSION_COOKIE: ${{ secrets.NOTE_SESSION_COOKIE }}
        run: |
          npx --yes wrangler@4 deploy
          printf '%s' "$DASHBOARD_TOKEN" | npx --yes wrangler@4 secret put DASHBOARD_TOKEN --name prince-like-review
          printf '%s' "$NOTE_SESSION_COOKIE" | npx --yes wrangler@4 secret put NOTE_SESSION_COOKIE --name prince-like-review
      - name: Upload review files (1 day)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prince-candidate-review
          path: |
            .tmp/candidates.json
            .tmp/candidate-review.html
            .tmp/mobile-15-preview.png
            .tmp/worker-like-preview.png
          if-no-files-found: error
          retention-days: 1
  auto-like:
    needs: collect
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.DISABLE_AUTO_LIKES != 'true' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with: {node-version: '24.19.0'}
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
      - name: Find Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN" || exit 1
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Download this run's candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: prince-candidate-review
          path: .tmp
      - name: Send at most one eligible like and persist its outcome
        env:
          NOTE_SESSION_COOKIE: ${{ secrets.NOTE_SESSION_COOKIE }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/auto-like.mjs

