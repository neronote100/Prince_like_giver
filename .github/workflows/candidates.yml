name: Collect manual note candidates

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/candidates.yml

permissions:
  contents: write
  id-token: write

concurrency:
  group: prince-manual-candidate-bridge
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main' && vars.DISABLE_CANDIDATE_DISCOVERY != 'true'
    uses: neronote100/nero_comment_reader/.github/workflows/like-candidates.yml@264f3794fc7bcc53c4d0a84ecdcc451901cc23a7
    with:
      source_ref: 264f3794fc7bcc53c4d0a84ecdcc451901cc23a7
    secrets:
      NOTE_SESSION_COOKIE: ${{ secrets.NOTE_SESSION_COOKIE }}
